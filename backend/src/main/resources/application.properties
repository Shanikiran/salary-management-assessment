spring.application.name=salary-management
server.port=8080

# SQLite file DB (created on first run if missing; schema.sql runs on startup)
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/salary.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# Serve the Angular production build from the same jar when present
spring.web.resources.static-locations=classpath:/static/

logging.level.com.acme.salary=INFO
